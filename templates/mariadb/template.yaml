apiVersion: hivora/v1
kind: Template
metadata:
  slug: mariadb
  name: MariaDB
  version: 1.2.0
  category: services
  tags: [database, sql, mysql]
  icon: { url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mariadb.svg" }
  description:
    fr: Base de données MariaDB (compatible MySQL), version LTS, joignable par les autres apps de sa zone.
    en: MariaDB database (MySQL compatible), LTS release, reachable by the other apps of its zone.
  links:
    site: https://mariadb.org
    doc: https://mariadb.com/kb/en/documentation/
  maintainer: hivora
  license: GPL-2.0 (image)
  source: https://hub.docker.com/_/mariadb
requirements:
  arch: [amd64, arm64]
  memory: { min: 256Mi, recommended: 512Mi }
  disk: { min: 1Gi }
form:
  basic:
    - id: db_name
      group: { fr: Base de données, en: Database }
      label: { fr: Nom de la base, en: Database name }
      type: string
      default: app
      pattern: "[A-Za-z_][A-Za-z0-9_]{0,62}"
      help:
        fr: "Joignable uniquement par les apps de la même zone (zone « reliées entre elles »), à l'adresse « <nom de l'app>-server-1:3306 ». Pour l'ouvrir au réseau local ou à Internet : mode avancé, « Accès réseau »."
        en: "Reachable only by the apps of the same zone (zone “linked together”), at “<app name>-server-1:3306”. To open it to the local network or the Internet: advanced mode, “Network access”."
    - id: db_user
      group: { fr: Base de données, en: Database }
      label: { fr: Utilisateur, en: User }
      type: string
      default: app
      pattern: "[A-Za-z_][A-Za-z0-9_]{0,62}"
    - id: db_password
      group: { fr: Base de données, en: Database }
      label: { fr: Mot de passe, en: Password }
      type: secret
      required: true
      pattern: ".{12,128}"
      help:
        fr: "Au moins 12 caractères. Il n'est plus affiché ensuite : notez-le pour vous connecter. Une montée de version majeure demande une migration manuelle ; une sauvegarde ne se restaure que sur la même version majeure."
        en: "At least 12 characters. It is not shown again: write it down to connect. A major version upgrade needs a manual migration; a backup only restores on the same major version."
  advanced:
    - id: expose
      group: { fr: Accès réseau, en: Network access }
      label: { fr: Ouvrir la base, en: Open the database }
      type: select
      default: internal
      options:
        - { value: internal, label: { fr: "Non (seulement les apps de sa zone et les outils liés)", en: "No (only the apps of its zone and the linked tools)" } }
        - { value: lan, label: { fr: Au réseau local, en: To the local network } }
        - { value: public, label: { fr: À Internet, en: To the Internet } }
      help:
        fr: "Réseau local : la base répond sur l'adresse de la machine dans le réseau local, pour un logiciel installé sur un poste (DBeaver, HeidiSQL…). Internet : elle répond sur toutes les adresses de la machine ; attention, n'importe qui peut alors tenter de s'y connecter, le pare-feu de l'hôte ne la protège pas (Docker le contourne) : mot de passe long, et préférez le VPN."
        en: "Local network: the database answers on the machine's local network address, for software on a computer (DBeaver, HeidiSQL…). Internet: it answers on every address of the machine; careful, anyone can then try to connect, the host firewall does not protect it (Docker bypasses it): long password, and prefer the VPN."
    - id: host_port
      group: { fr: Accès réseau, en: Network access }
      label: { fr: Port sur la machine, en: Port on the machine }
      type: port
      default: 3306
      help:
        fr: "Utilisé seulement si la base est ouverte. Les apps de la zone et les outils liés gardent le port 3306."
        en: "Used only when the database is open. The apps of the zone and the linked tools keep port 3306."
    - id: root_password
      group: { fr: Avancé, en: Advanced }
      label: { fr: Mot de passe root, en: Root password }
      type: secret
      generate: { length: 32 }
      pattern: ".{12,128}"
      help:
        fr: "Laissé vide, il est généré et n'est pas affiché : utilisez l'utilisateur ci-dessus. Saisissez-le si vous avez besoin du compte root."
        en: "Left empty, it is generated and not shown: use the user above. Enter one if you need the root account."
    - id: max_connections
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Connexions simultanées max, en: Max simultaneous connections }
      type: integer
      default: 151
      range: [10, 10000]
    - id: charset
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Jeu de caractères, en: Character set }
      type: select
      default: utf8mb4
      options:
        - { value: utf8mb4, label: { fr: "utf8mb4 (recommandé : tout Unicode, émojis compris)", en: "utf8mb4 (recommended: all of Unicode, emoji included)" } }
        - { value: utf8mb3, label: { fr: "utf8mb3 (ancien UTF-8, sans émojis)", en: "utf8mb3 (older UTF-8, no emoji)" } }
        - { value: latin1, label: { fr: "latin1 (Europe de l'Ouest, anciennes apps)", en: "latin1 (Western Europe, older apps)" } }
    - id: innodb_buffer_pool
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Mémoire de cache InnoDB, en: InnoDB cache memory }
      type: string
      default: 128M
      pattern: "[1-9][0-9]{0,5}[MG]"
      help:
        fr: "La mémoire qui garde les données en cache (ex. 128M, 1G) : plus elle est grande, plus la base est rapide, dans la limite de la mémoire de la machine."
        en: "The memory that caches the data (e.g. 128M, 1G): the larger, the faster the database, within the machine's memory."
    - id: extra_args
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Paramètres supplémentaires, en: Extra settings }
      type: string
      pattern: "--[a-z0-9_-]{1,64}(=[A-Za-z0-9_.,:/+-]{1,128})?( --[a-z0-9_-]{1,64}(=[A-Za-z0-9_.,:/+-]{1,128})?){0,39}"
      help:
        fr: "Facultatif. D'autres options du serveur MariaDB, séparées par des espaces, ex. « --max-allowed-packet=64M --wait-timeout=600 »."
        en: "Optional. Other MariaDB server options, separated by spaces, e.g. “--max-allowed-packet=64M --wait-timeout=600”."
services:
  server:
    role: main
    image: mariadb
    tag: "11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68"
    track: minor
    command: "--character-set-server={{ form.charset }} --max-connections={{ form.max_connections }} --innodb-buffer-pool-size={{ form.innodb_buffer_pool }} {{ form.extra_args }}"
    env:
      MARIADB_ROOT_PASSWORD: "{{ secret.root_password }}"
      MARIADB_DATABASE: "{{ form.db_name }}"
      MARIADB_USER: "{{ form.db_user }}"
      MARIADB_PASSWORD: "{{ secret.db_password }}"
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_MYSQL_LOCALHOST_USER: "1"
      MARIADB_MYSQL_LOCALHOST_GRANTS: USAGE
      TZ: "{{ host.timezone }}"
    ports:
      - { container: 3306, host: "{{ form.host_port }}", purpose: other, exposure: internal, exposure_field: expose }
    volumes:
      - { name: data, target: /var/lib/mysql, backup: true }
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
backup:
  volumes: [data]
# How a linked tool (phpMyAdmin) reaches this database (link.<field>.*).
connection:
  port: 3306
  database: "{{ form.db_name }}"
  user: "{{ form.db_user }}"
  password: db_password
update:
  strategy: manual
defaults:
  restart: unless-stopped

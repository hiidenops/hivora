apiVersion: hivora/v1
kind: Template
metadata:
  slug: vaultwarden
  name: Vaultwarden
  version: 1.3.0
  category: productivity
  tags: [passwords, bitwarden, security]
  icon:
    url: https://raw.githubusercontent.com/dani-garcia/vaultwarden/main/resources/vaultwarden-icon.svg
  description:
    fr: Serveur de mots de passe compatible avec les applications Bitwarden, léger et auto-hébergé.
    en: Lightweight, self-hosted password server compatible with the Bitwarden apps.
  links:
    site: https://github.com/dani-garcia/vaultwarden
    doc: https://github.com/dani-garcia/vaultwarden/wiki
  maintainer: hivora
  license: AGPL-3.0
  source: https://hub.docker.com/r/vaultwarden/server
requirements:
  arch: [amd64, arm64]
  memory: { min: 64Mi, recommended: 256Mi }
  disk: { min: 1Gi }
form:
  basic:
    - id: domain
      label: { fr: "Adresse d'accès (URL complète)", en: Access address (full URL) }
      type: url
      required: true
      default: 'http://{{ host.lan_ip | default("localhost") }}:{{ form.web_port }}'
      help:
        fr: "Vide : http://<IP locale>:<port web>. Les clients Bitwarden exigent HTTPS, sauf sur localhost : utilisez l'URL finale derrière votre proxy."
        en: "Empty: http://<local IP>:<web port>. Bitwarden clients require HTTPS except on localhost: use the final URL behind your proxy."
    - id: signups_allowed
      label: { fr: Autoriser les inscriptions, en: Allow sign-ups }
      type: boolean
      default: true
      help: { fr: Désactivez-les une fois vos comptes créés., en: Turn them off once your accounts exist. }
    - id: admin_token
      label: { fr: "Jeton de la page d'administration (/admin)", en: Admin page token (/admin) }
      type: secret
      generate: { length: 48 }
  advanced:
    - id: web_port
      label: { fr: Port web, en: Web port }
      type: port
      default: 8080
services:
  server:
    role: main
    image: vaultwarden/server
    tag: "1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0"
    env:
      DOMAIN: "{{ form.domain }}"
      SIGNUPS_ALLOWED: "{{ form.signups_allowed }}"
      ADMIN_TOKEN: "{{ secret.admin_token }}"
      TZ: "{{ host.timezone }}"
    ports:
      - { container: 80, host: "{{ form.web_port }}", purpose: web, exposure: lan }
    volumes:
      - { name: data, target: /data, backup: true }
    healthcheck:
      # Keep the image's check, poll it faster than its 60 s default.
      interval: 10s
      start_period: 5s
access:
  web: "{{ form.domain }}"
backup:
  volumes: [data]
update:
  strategy: manual
defaults:
  restart: unless-stopped

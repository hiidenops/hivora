apiVersion: hivora/v1
kind: Template
metadata:
  slug: wireguard
  name: WireGuard
  version: 2.0.0
  category: network
  tags: [vpn, wireguard, network, remote-access]
  icon: { url: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wireguard.png" }
  description:
    fr: VPN WireGuard géré par Hivora (clients, clés, QR codes, zones) pour accéder à votre réseau et à vos serveurs depuis l'extérieur.
    en: WireGuard VPN managed by Hivora (clients, keys, QR codes, zones) to reach your network and servers from outside.
  links:
    site: https://www.wireguard.com
    doc: https://docs.linuxserver.io/images/docker-wireguard/
  maintainer: hivora
  license: GPL-3.0 (image)
  source: https://github.com/linuxserver/docker-wireguard
requirements:
  arch: [amd64, arm64]
  memory: { min: 64Mi, recommended: 128Mi }
  disk: { min: 100Mi }
form:
  basic:
    - id: host
      group: { fr: Accès, en: Access }
      label: { fr: Adresse publique du serveur, en: Server public address }
      type: string
      required: true
      default: "{{ host.public_ip }}"
      pattern: "[A-Za-z0-9.:-]{3,253}"
      help:
        fr: IP publique ou nom de domaine que les clients utiliseront. Ouvrez le port UDP 51820 sur votre box.
        en: Public IP or domain name clients will use. Open UDP port 51820 on your router.
    - id: allowed_ips
      group: { fr: Réseau VPN, en: VPN network }
      label: { fr: Trafic envoyé dans le VPN, en: Traffic sent through the VPN }
      type: string
      default: "0.0.0.0/0"
      pattern: "[0-9./, ]{9,300}"
      help:
        fr: "0.0.0.0/0 = tout le trafic des clients. Pour n'accéder qu'à votre réseau local : par ex. 192.168.1.0/24."
        en: "0.0.0.0/0 = all client traffic. To reach only your local network: e.g. 192.168.1.0/24."
    - id: dns
      group: { fr: Réseau VPN, en: VPN network }
      label: { fr: DNS des clients, en: Client DNS }
      type: string
      default: "1.1.1.1,9.9.9.9"
      pattern: "[0-9a-fA-F.:, ]{7,200}"
  advanced:
    - id: vpn_zones
      group: { fr: Zones accessibles, en: Zones reached }
      label: { fr: Zones accessibles par le VPN, en: Zones reached through the VPN }
      type: string
      pattern: "[a-z0-9,-]{0,500}"
      help:
        fr: "Se règle depuis la carte VPN de la fiche. Seules les zones « Reliées entre elles » ont un réseau à rejoindre."
        en: "Set from the VPN card on the app page. Only “Linked together” zones have a network to join."
services:
  server:
    role: main
    image: ghcr.io/linuxserver/wireguard
    tag: "1.0.20260223-r0-ls123@sha256:33c5e4260f5ddf9376fcb6f1ff90c0ccc3c63d2ab469595e33d178ecf8a4c4c6"
    env:
      PUID: "{{ host.puid }}"
      PGID: "{{ host.pgid }}"
      TZ: "{{ host.timezone }}"
      # No PEERS: the image only brings up the config Hivora writes in wg_confs/.
    ports:
      - { container: 51820, protocol: udp, purpose: game, exposure: public }
    volumes:
      - { name: config, target: /config, backup: true }
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1, net.ipv4.conf.all.src_valid_mark: 1 }
vpn:
  provider: wireguard
  volume: config
  endpoint_field: host
  dns_field: dns
  allowed_ips_field: allowed_ips
  zones_field: vpn_zones
backup:
  volumes: [config]
update:
  strategy: manual
defaults:
  zone: administration
  restart: unless-stopped

apiVersion: hivora/v1
kind: Template
metadata:
  slug: postgresql
  name: PostgreSQL
  version: 1.2.0
  category: services
  tags: [database, sql]
  icon: { url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/postgresql.svg" }
  description:
    fr: Base de données relationnelle PostgreSQL, joignable par les autres apps de sa zone.
    en: PostgreSQL relational database, reachable by the other apps of its zone.
  links:
    site: https://www.postgresql.org
    doc: https://www.postgresql.org/docs/18/
  maintainer: hivora
  license: PostgreSQL License (image)
  source: https://hub.docker.com/_/postgres
requirements:
  arch: [amd64, arm64]
  memory: { min: 128Mi, recommended: 512Mi }
  disk: { min: 1Gi }
form:
  basic:
    - id: db_name
      group: { fr: Base de données, en: Database }
      label: { fr: Nom de la base, en: Database name }
      type: string
      default: app
      pattern: "[A-Za-z_][A-Za-z0-9_]{0,62}"
      help:
        fr: "Joignable uniquement par les apps de la même zone (zone « reliées entre elles »), à l'adresse « <nom de l'app>-server-1:5432 ». Pour l'ouvrir au réseau local ou à Internet : mode avancé, « Accès réseau »."
        en: "Reachable only by the apps of the same zone (zone “linked together”), at “<app name>-server-1:5432”. To open it to the local network or the Internet: advanced mode, “Network access”."
    - id: db_user
      group: { fr: Base de données, en: Database }
      label: { fr: Utilisateur, en: User }
      type: string
      default: app
      pattern: "[A-Za-z_][A-Za-z0-9_]{0,62}"
    - id: db_password
      group: { fr: Base de données, en: Database }
      label: { fr: Mot de passe, en: Password }
      type: secret
      required: true
      pattern: ".{12,128}"
      help:
        fr: "Au moins 12 caractères. Il n'est plus affiché ensuite : notez-le pour vous connecter. Une montée de version majeure demande une migration manuelle ; une sauvegarde ne se restaure que sur la même version majeure."
        en: "At least 12 characters. It is not shown again: write it down to connect. A major version upgrade needs a manual migration; a backup only restores on the same major version."
  advanced:
    - id: expose
      group: { fr: Accès réseau, en: Network access }
      label: { fr: Ouvrir la base, en: Open the database }
      type: select
      default: internal
      options:
        - { value: internal, label: { fr: "Non (seulement les apps de sa zone et les outils liés)", en: "No (only the apps of its zone and the linked tools)" } }
        - { value: lan, label: { fr: Au réseau local, en: To the local network } }
        - { value: public, label: { fr: À Internet, en: To the Internet } }
      help:
        fr: "Réseau local : la base répond sur l'adresse de la machine dans le réseau local, pour un logiciel installé sur un poste (DBeaver, HeidiSQL…). Internet : elle répond sur toutes les adresses de la machine ; attention, n'importe qui peut alors tenter de s'y connecter, le pare-feu de l'hôte ne la protège pas (Docker le contourne) : mot de passe long, et préférez le VPN."
        en: "Local network: the database answers on the machine's local network address, for software on a computer (DBeaver, HeidiSQL…). Internet: it answers on every address of the machine; careful, anyone can then try to connect, the host firewall does not protect it (Docker bypasses it): long password, and prefer the VPN."
    - id: host_port
      group: { fr: Accès réseau, en: Network access }
      label: { fr: Port sur la machine, en: Port on the machine }
      type: port
      default: 5432
      help:
        fr: "Utilisé seulement si la base est ouverte. Les apps de la zone et les outils liés gardent le port 5432."
        en: "Used only when the database is open. The apps of the zone and the linked tools keep port 5432."
    - id: max_connections
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Connexions simultanées max, en: Max simultaneous connections }
      type: integer
      default: 100
      range: [10, 10000]
    - id: shared_buffers
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Mémoire de cache (shared_buffers), en: Cache memory (shared_buffers) }
      type: string
      default: 128MB
      pattern: "[1-9][0-9]{0,6}(kB|MB|GB)"
      help:
        fr: "La mémoire partagée qui garde les données en cache (ex. 128MB, 1GB ; souvent un quart de la mémoire de la machine)."
        en: "The shared memory that caches the data (e.g. 128MB, 1GB; often a quarter of the machine's memory)."
    - id: work_mem
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Mémoire par tri (work_mem), en: Memory per sort (work_mem) }
      type: string
      default: 4MB
      pattern: "[1-9][0-9]{0,6}(kB|MB|GB)"
    - id: extra_args
      group: { fr: Réglages du serveur, en: Server settings }
      label: { fr: Paramètres supplémentaires, en: Extra settings }
      type: string
      pattern: "-c [a-z_.]{1,64}=[A-Za-z0-9_.,:/+-]{1,128}( -c [a-z_.]{1,64}=[A-Za-z0-9_.,:/+-]{1,128}){0,39}"
      help:
        fr: "Facultatif. D'autres paramètres de PostgreSQL, ex. « -c log_min_duration_statement=500 -c timezone=Europe/Paris »."
        en: "Optional. Other PostgreSQL settings, e.g. “-c log_min_duration_statement=500 -c timezone=Europe/Paris”."
services:
  server:
    role: main
    image: postgres
    tag: "18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
    track: minor
    command: "postgres -c max_connections={{ form.max_connections }} -c shared_buffers={{ form.shared_buffers }} -c work_mem={{ form.work_mem }} {{ form.extra_args }}"
    env:
      POSTGRES_DB: "{{ form.db_name }}"
      POSTGRES_USER: "{{ form.db_user }}"
      POSTGRES_PASSWORD: "{{ secret.db_password }}"
      TZ: "{{ host.timezone }}"
    ports:
      - { container: 5432, host: "{{ form.host_port }}", purpose: other, exposure: internal, exposure_field: expose }
    volumes:
      - { name: data, target: /var/lib/postgresql, backup: true }
    healthcheck:
      # The container's own variables ($$: read by its shell, not by Compose).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
backup:
  volumes: [data]
# How a linked tool (pgAdmin) reaches this database (link.<field>.*).
connection:
  port: 5432
  database: "{{ form.db_name }}"
  user: "{{ form.db_user }}"
  password: db_password
update:
  strategy: manual
defaults:
  restart: unless-stopped

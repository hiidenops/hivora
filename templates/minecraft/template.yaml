apiVersion: hivora/v1
kind: Template
metadata:
  slug: minecraft
  name: Minecraft Java
  version: 1.1.0
  category: games
  tags: [minecraft, java, sandbox]
  icon: minecraft.svg
  description:
    fr: Serveur Minecraft Java Edition (vanilla par défaut), basé sur l'image itzg/minecraft-server.
    en: Minecraft Java Edition server (vanilla by default), based on the itzg/minecraft-server image.
  links:
    site: https://www.minecraft.net
    doc: https://docker-minecraft-server.readthedocs.io
  maintainer: hivora
  license: Minecraft EULA
  source: https://hub.docker.com/r/itzg/minecraft-server
requirements:
  arch: [amd64, arm64]
  memory: { min: 2Gi, recommended: 4Gi }
  disk: { min: 5Gi }
form:
  basic:
    - id: eula
      label:
        fr: J'accepte le contrat de licence Minecraft (https://aka.ms/MinecraftEULA)
        en: I accept the Minecraft EULA (https://aka.ms/MinecraftEULA)
      type: boolean
      required: true
    - id: motd
      label: { fr: Message affiché dans la liste des serveurs, en: Message shown in the server list }
      type: string
      default: "Serveur {{ app.name }}"
    - id: max_players
      label: { fr: Joueurs max, en: Max players }
      type: integer
      default: 10
      range: [1, 100]
    - id: difficulty
      label: { fr: Difficulté, en: Difficulty }
      type: select
      default: normal
      options:
        - { value: peaceful, label: { fr: Paisible, en: Peaceful } }
        - { value: easy, label: { fr: Facile, en: Easy } }
        - { value: normal, label: { fr: Normale, en: Normal } }
        - { value: hard, label: { fr: Difficile, en: Hard } }
    - id: mode
      label: { fr: Mode de jeu, en: Game mode }
      type: select
      default: survival
      options:
        - { value: survival, label: { fr: Survie, en: Survival } }
        - { value: creative, label: { fr: Créatif, en: Creative } }
        - { value: adventure, label: { fr: Aventure, en: Adventure } }
  advanced:
    - id: version
      label: { fr: Version de Minecraft, en: Minecraft version }
      type: string
      default: LATEST
      pattern: "LATEST|SNAPSHOT|[0-9]+\\.[0-9]+(\\.[0-9]+)?"
    - id: memory
      label: { fr: Mémoire allouée à Java, en: Java memory }
      type: select
      default: 2G
      options:
        - { value: 1G, label: { fr: 1 Go, en: 1 GB } }
        - { value: 2G, label: { fr: 2 Go, en: 2 GB } }
        - { value: 4G, label: { fr: 4 Go, en: 4 GB } }
        - { value: 6G, label: { fr: 6 Go, en: 6 GB } }
        - { value: 8G, label: { fr: 8 Go, en: 8 GB } }
    - id: online_mode
      label: { fr: Vérifier les comptes Mojang (online-mode), en: Verify Mojang accounts (online-mode) }
      type: boolean
      default: true
    - id: game_port
      label: { fr: Port de jeu (TCP), en: Game port (TCP) }
      type: port
      default: 25565
    - id: rcon_password
      label: { fr: Mot de passe RCON, en: RCON password }
      type: secret
      generate: { length: 24 }
services:
  server:
    role: main
    image: itzg/minecraft-server
    tag: "2026.9.1-java21@sha256:21b3d6bad32cc49ca15c8ceefcaffe94ac7fb6a53939fc7a5da066ec5dd0bc1d"
    env:
      EULA: "{{ form.eula | upper }}"
      MOTD: "{{ form.motd }}"
      MAX_PLAYERS: "{{ form.max_players }}"
      DIFFICULTY: "{{ form.difficulty }}"
      MODE: "{{ form.mode }}"
      VERSION: "{{ form.version }}"
      MEMORY: "{{ form.memory }}"
      ONLINE_MODE: "{{ form.online_mode | upper }}"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "{{ secret.rcon_password }}"
      TZ: "{{ host.timezone }}"
      UID: "{{ host.puid }}"
      GID: "{{ host.pgid }}"
    ports:
      - { container: 25565, host: "{{ form.game_port }}", purpose: game, exposure: public }
      - { container: 25575, purpose: rcon, exposure: internal }
    volumes:
      - { name: data, target: /data, backup: true }
    stdin_open: true  # server console (attach)
    tty: true
access:
  game: "{{ host.public_ip }}:{{ form.game_port }}"
backup:
  volumes: [data]
  pause: true
update:
  strategy: manual
game:
  query: minecraft
  rcon_port: 25575
  max_players: "{{ form.max_players }}"
  stop_command: stop
defaults:
  zone: gaming
  restart: unless-stopped

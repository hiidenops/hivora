apiVersion: hivora/v1
kind: Template
metadata:
  slug: minecraft
  name: Minecraft Java
  version: 1.11.0
  category: games
  tags: [minecraft, java, sandbox]
  icon:
    url: https://minecraft.wiki/images/Grass_Block_JE7_BE6.png
  description:
    fr: Serveur Minecraft Java Edition (vanilla par défaut), basé sur l'image itzg/minecraft-server.
    en: Minecraft Java Edition server (vanilla by default), based on the itzg/minecraft-server image.
  links:
    site: https://www.minecraft.net
    doc: https://docker-minecraft-server.readthedocs.io
  maintainer: hivora
  license: Minecraft EULA
  source: https://hub.docker.com/r/itzg/minecraft-server
requirements:
  arch: [amd64, arm64]
  memory: { min: 2Gi, recommended: 4Gi }
  disk: { min: 5Gi }
form:
  basic:
    - id: eula
      label:
        fr: J'accepte le contrat de licence Minecraft (https://aka.ms/MinecraftEULA)
        en: I accept the Minecraft EULA (https://aka.ms/MinecraftEULA)
      type: boolean
      required: true
    - id: server_type
      group: { fr: Serveur, en: Server }
      label: { fr: Type de serveur, en: Server type }
      reset_data_on_change: true
      type: select
      default: VANILLA
      options:
        - { value: VANILLA, label: Vanilla }
        - { value: PAPER, label: { fr: "Paper (plugins)", en: "Paper (plugins)" } }
        - { value: FABRIC, label: { fr: "Fabric (mods)", en: "Fabric (mods)" } }
        - { value: FORGE, label: { fr: "Forge (mods)", en: "Forge (mods)" } }
        - { value: AUTO_CURSEFORGE, label: { fr: Modpack CurseForge, en: CurseForge modpack } }
        - { value: MODRINTH, label: { fr: Modpack Modrinth, en: Modrinth modpack } }
    - id: cf_modpack
      group: { fr: Serveur, en: Server }
      label: { fr: Modpack CurseForge (nom dans l'URL), en: CurseForge modpack (name in the URL) }
      reset_data_on_change: true
      type: string
      required: true
      showIf: { server_type: AUTO_CURSEFORGE }
      pattern: "[a-z0-9-]+"
      help:
        fr: "Ex. all-the-mods-9 pour curseforge.com/minecraft/modpacks/all-the-mods-9. Prévoyez 6 Go de mémoire ou plus."
        en: "E.g. all-the-mods-9 for curseforge.com/minecraft/modpacks/all-the-mods-9. Allow 6 GB of memory or more."
    - id: cf_api_key
      group: { fr: Serveur, en: Server }
      label: { fr: Clé API CurseForge, en: CurseForge API key }
      type: secret
      required: true
      from_setting: curseforge_api_key
      showIf: { server_type: AUTO_CURSEFORGE }
      help:
        fr: Laissez vide pour utiliser la clé enregistrée dans Paramètres. Gratuite sur console.curseforge.com.
        en: Leave empty to use the key saved in Settings. Free at console.curseforge.com.
    - id: modrinth_modpack
      group: { fr: Serveur, en: Server }
      label: { fr: Modpack Modrinth (nom ou URL), en: Modrinth modpack (name or URL) }
      reset_data_on_change: true
      type: string
      required: true
      showIf: { server_type: MODRINTH }
      help:
        fr: "Ex. cobblemon-fabric ou https://modrinth.com/modpack/cobblemon-fabric. Aucune clé nécessaire."
        en: "E.g. cobblemon-fabric or https://modrinth.com/modpack/cobblemon-fabric. No key needed."
    - id: version
      group: { fr: Serveur, en: Server }
      label: { fr: Version de Minecraft, en: Minecraft version }
      reset_data_on_change: true
      type: string
      default: LATEST
      options_from: minecraft_versions
      pattern: "[0-9A-Za-z._-]{2,40}"
    - id: memory
      group: { fr: Serveur, en: Server }
      label: { fr: Mémoire allouée à Java, en: Java memory }
      type: select
      default: 2G
      options:
        - { value: 1G, label: { fr: 1 Go, en: 1 GB } }
        - { value: 2G, label: { fr: 2 Go, en: 2 GB } }
        - { value: 4G, label: { fr: 4 Go, en: 4 GB } }
        - { value: 6G, label: { fr: 6 Go, en: 6 GB } }
        - { value: 8G, label: { fr: 8 Go, en: 8 GB } }
        - { value: 12G, label: { fr: 12 Go, en: 12 GB } }
        - { value: 16G, label: { fr: 16 Go, en: 16 GB } }
    - id: motd
      group: { fr: Général, en: General }
      label: { fr: Message affiché dans la liste des serveurs, en: Message shown in the server list }
      type: string
      default: "Serveur {{ app.name }}"
    - id: max_players
      group: { fr: Général, en: General }
      label: { fr: Joueurs max, en: Max players }
      type: integer
      default: 10
      range: [1, 100]
    - id: difficulty
      group: { fr: Général, en: General }
      label: { fr: Difficulté, en: Difficulty }
      type: select
      default: normal
      options:
        - { value: peaceful, label: { fr: Paisible, en: Peaceful } }
        - { value: easy, label: { fr: Facile, en: Easy } }
        - { value: normal, label: { fr: Normale, en: Normal } }
        - { value: hard, label: { fr: Difficile, en: Hard } }
    - id: mode
      group: { fr: Général, en: General }
      label: { fr: Mode de jeu, en: Game mode }
      type: select
      default: survival
      options:
        - { value: survival, label: { fr: Survie, en: Survival } }
        - { value: creative, label: { fr: Créatif, en: Creative } }
        - { value: adventure, label: { fr: Aventure, en: Adventure } }
    - id: enable_whitelist
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Liste blanche (seuls les joueurs autorisés peuvent se connecter), en: Whitelist (only allowed players can join) }
      type: boolean
      default: false
    - id: pvp
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Combat entre joueurs (PvP), en: Player versus player (PvP) }
      type: boolean
      default: true
    - id: hardcore
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Mode hardcore, en: Hardcore mode }
      type: boolean
      default: false
    - id: allow_nether
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Autoriser le Nether, en: Allow the Nether }
      type: boolean
      default: true
    - id: allow_flight
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Autoriser le vol (mods), en: Allow flight (mods) }
      type: boolean
      default: false
    - id: spawn_monsters
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Apparition des monstres, en: Spawn monsters }
      type: boolean
      default: true
    - id: spawn_animals
      group: { fr: Règles du jeu, en: Game rules }
      label: { fr: Apparition des animaux, en: Spawn animals }
      type: boolean
      default: true
    - id: level_type
      group: { fr: Monde, en: World }
      label: { fr: Type de monde (nouveau monde), en: World type (new world) }
      type: select
      default: minecraft:normal
      options:
        - { value: "minecraft:normal", label: { fr: Normal, en: Normal } }
        - { value: "minecraft:flat", label: { fr: Plat, en: Flat } }
        - { value: "minecraft:large_biomes", label: { fr: Grands biomes, en: Large biomes } }
        - { value: "minecraft:amplified", label: { fr: Amplifié, en: Amplified } }
    - id: seed
      group: { fr: Monde, en: World }
      label: { fr: Graine du monde (nouveau monde), en: World seed (new world) }
      type: string
      pattern: "-?[0-9A-Za-z_ ]{0,64}"
    - id: level
      group: { fr: Monde, en: World }
      label: { fr: Monde actif (dossier), en: Active world (folder) }
      type: string
      default: world
      pattern: "[A-Za-z0-9][A-Za-z0-9_-]{0,47}"
      help:
        fr: "Dossier du monde chargé au démarrage ; un nom nouveau crée un monde. Se gère aussi depuis la carte Mondes."
        en: "World folder loaded on start; a new name creates a world. Also managed from the Worlds card."
  advanced:
    - id: view_distance
      group: { fr: Monde et performances, en: World and performance }
      label: { fr: Distance de vue (chunks), en: View distance (chunks) }
      type: integer
      default: 10
      range: [3, 32]
    - id: simulation_distance
      group: { fr: Monde et performances, en: World and performance }
      label: { fr: Distance de simulation (chunks), en: Simulation distance (chunks) }
      type: integer
      default: 10
      range: [3, 32]
    - id: spawn_protection
      group: { fr: Monde et performances, en: World and performance }
      label: { fr: Protection du spawn (blocs), en: Spawn protection (blocks) }
      type: integer
      default: 16
      range: [0, 256]
    - id: max_world_size
      group: { fr: Monde et performances, en: World and performance }
      label: { fr: Taille max du monde (rayon en blocs), en: Max world size (radius in blocks) }
      type: integer
      default: 29999984
      range: [1000, 29999984]
    - id: enable_command_block
      group: { fr: Monde et performances, en: World and performance }
      label: { fr: Blocs de commande, en: Command blocks }
      type: boolean
      default: false
    - id: game_port
      group: { fr: Réseau et sécurité, en: Network and security }
      label: { fr: Port de jeu (TCP), en: Game port (TCP) }
      type: port
      default: 25565
    - id: online_mode
      group: { fr: Réseau et sécurité, en: Network and security }
      label: { fr: Vérifier les comptes Mojang (online-mode), en: Verify Mojang accounts (online-mode) }
      type: boolean
      default: true
    - id: rcon_password
      group: { fr: Réseau et sécurité, en: Network and security }
      label: { fr: Mot de passe RCON, en: RCON password }
      type: secret
      generate: { length: 24 }
    - id: custom_properties
      group: { fr: Propriétés personnalisées, en: Custom properties }
      label: { fr: Propriétés personnalisées (server.properties), en: Custom properties (server.properties) }
      type: text
      help:
        fr: "Une propriété par ligne, ex. « white-list=true ». Appliquées à chaque démarrage, après les réglages ci-dessus."
        en: "One property per line, e.g. \"white-list=true\". Applied on every start, after the settings above."
      suggestions:
        - { value: "force-gamemode=false", description: { fr: "Forcer le mode de jeu par défaut à chaque connexion", en: "Force the default game mode on every join" } }
        - { value: "generate-structures=true", description: { fr: "Générer villages, temples, etc. (nouveau terrain)", en: "Generate villages, temples, etc. (new terrain)" } }
        - { value: "spawn-npcs=true", description: { fr: "Faire apparaître les villageois", en: "Spawn villagers" } }
        - { value: "player-idle-timeout=0", description: { fr: "Expulser un joueur inactif après N minutes (0 = jamais)", en: "Kick idle players after N minutes (0 = never)" } }
        - { value: "op-permission-level=4", description: { fr: "Niveau de permission des opérateurs (1 à 4)", en: "Operators' permission level (1 to 4)" } }
        - { value: "function-permission-level=2", description: { fr: "Niveau de permission des fonctions (datapacks)", en: "Permission level of functions (datapacks)" } }
        - { value: "hide-online-players=false", description: { fr: "Masquer la liste des joueurs dans le menu multijoueur", en: "Hide the player list in the multiplayer menu" } }
        - { value: "enable-status=true", description: { fr: "Apparaître comme en ligne dans la liste des serveurs", en: "Show as online in the server list" } }
        - { value: "enforce-secure-profile=true", description: { fr: "Exiger des profils de discussion signés par Mojang", en: "Require Mojang-signed chat profiles" } }
        - { value: "prevent-proxy-connections=false", description: { fr: "Refuser les connexions via VPN/proxy détectées", en: "Refuse connections detected through VPN/proxy" } }
        - { value: "rate-limit=0", description: { fr: "Paquets max par seconde et par joueur (0 = illimité)", en: "Max packets per second per player (0 = unlimited)" } }
        - { value: "network-compression-threshold=256", description: { fr: "Taille (octets) à partir de laquelle les paquets sont compressés", en: "Packet size (bytes) from which packets are compressed" } }
        - { value: "max-tick-time=60000", description: { fr: "Durée max d'un tick (ms) avant arrêt de sécurité (-1 = désactivé)", en: "Max tick duration (ms) before a safety stop (-1 = off)" } }
        - { value: "max-chained-neighbor-updates=1000000", description: { fr: "Limite des mises à jour de blocs en chaîne", en: "Limit of chained block updates" } }
        - { value: "entity-broadcast-range-percentage=100", description: { fr: "Distance d'affichage des entités (10 à 1000 %)", en: "Entity display distance (10 to 1000 %)" } }
        - { value: "sync-chunk-writes=true", description: { fr: "Écrire les chunks de façon synchrone (plus sûr, plus lent)", en: "Write chunks synchronously (safer, slower)" } }
        - { value: "pause-when-empty-seconds=60", description: { fr: "Mettre le serveur en pause quand il est vide depuis N secondes", en: "Pause the server when empty for N seconds" } }
        - { value: "resource-pack=", description: { fr: "URL d'un pack de ressources proposé aux joueurs", en: "URL of a resource pack offered to players" } }
        - { value: "resource-pack-sha1=", description: { fr: "Empreinte SHA-1 du pack de ressources", en: "SHA-1 hash of the resource pack" } }
        - { value: "require-resource-pack=false", description: { fr: "Refuser les joueurs qui déclinent le pack de ressources", en: "Kick players who decline the resource pack" } }
        - { value: "resource-pack-prompt=", description: { fr: "Message affiché avec la demande de pack de ressources", en: "Message shown with the resource pack prompt" } }
        - { value: "initial-enabled-packs=vanilla", description: { fr: "Datapacks activés à la création du monde", en: "Datapacks enabled when the world is created" } }
        - { value: "generator-settings={}", description: { fr: "Réglages du générateur (monde plat personnalisé)", en: "Generator settings (custom flat world)" } }
        - { value: "broadcast-console-to-ops=true", description: { fr: "Envoyer les commandes de la console aux opérateurs", en: "Send console commands to operators" } }
        - { value: "broadcast-rcon-to-ops=true", description: { fr: "Envoyer les commandes RCON aux opérateurs", en: "Send RCON commands to operators" } }
        - { value: "log-ips=true", description: { fr: "Enregistrer les adresses IP dans les logs", en: "Log player IP addresses" } }
        - { value: "enable-query=false", description: { fr: "Activer le protocole Query (GameSpy4) sur le port de jeu", en: "Enable the Query (GameSpy4) protocol on the game port" } }
        - { value: "accepts-transfers=false", description: { fr: "Accepter les joueurs transférés depuis un autre serveur", en: "Accept players transferred from another server" } }
        - { value: "bug-report-link=", description: { fr: "Lien affiché aux joueurs pour signaler un bug", en: "Link shown to players to report a bug" } }
services:
  server:
    role: main
    image: itzg/minecraft-server
    # Java 25: required by Minecraft 26.x ("LATEST"); java21 fails with UnsupportedClassVersionError.
    tag: "2026.9.1-java25@sha256:e8640538dac5d54c2838d57fa9641e735ad0cf2b71fb0e8a68da3b542a315749"
    env:
      EULA: "{{ form.eula | upper }}"
      MOTD: "{{ form.motd }}"
      MAX_PLAYERS: "{{ form.max_players }}"
      DIFFICULTY: "{{ form.difficulty }}"
      MODE: "{{ form.mode }}"
      VERSION: "{{ form.version }}"
      MEMORY: "{{ form.memory }}"
      ONLINE_MODE: "{{ form.online_mode | upper }}"
      TYPE: "{{ form.server_type }}"
      CF_SLUG: "{{ form.cf_modpack }}"
      CF_API_KEY: "{{ secret.cf_api_key }}"
      MODRINTH_MODPACK: "{{ form.modrinth_modpack }}"
      ENABLE_WHITELIST: "{{ form.enable_whitelist }}"
      ENFORCE_WHITELIST: "{{ form.enable_whitelist }}"
      PVP: "{{ form.pvp }}"
      HARDCORE: "{{ form.hardcore }}"
      ALLOW_NETHER: "{{ form.allow_nether }}"
      ALLOW_FLIGHT: "{{ form.allow_flight }}"
      SPAWN_MONSTERS: "{{ form.spawn_monsters }}"
      SPAWN_ANIMALS: "{{ form.spawn_animals }}"
      ENABLE_COMMAND_BLOCK: "{{ form.enable_command_block }}"
      VIEW_DISTANCE: "{{ form.view_distance }}"
      SIMULATION_DISTANCE: "{{ form.simulation_distance }}"
      SPAWN_PROTECTION: "{{ form.spawn_protection }}"
      MAX_WORLD_SIZE: "{{ form.max_world_size }}"
      LEVEL_TYPE: "{{ form.level_type }}"
      SEED: "{{ form.seed }}"
      LEVEL: "{{ form.level }}"
      CUSTOM_SERVER_PROPERTIES: "{{ form.custom_properties }}"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "{{ secret.rcon_password }}"
      TZ: "{{ host.timezone }}"
      UID: "{{ host.puid }}"
      GID: "{{ host.pgid }}"
    ports:
      - { container: 25565, host: "{{ form.game_port }}", purpose: game, exposure: public }
      - { container: 25575, purpose: rcon, exposure: internal }
    volumes:
      - { name: data, target: /data, backup: true,
          reset_keep: [whitelist.json, ops.json, banned-players.json, banned-ips.json] }
    stdin_open: true  # server console (attach)
    tty: true
access:
  game: "{{ host.public_ip }}:{{ form.game_port }}"
backup:
  volumes: [data]
  pause: true
update:
  strategy: manual
game:
  # rcon-cli ships with the image and reads RCON_PASSWORD from the environment.
  console: [rcon-cli]
  players: { command: [rcon-cli, list], format: minecraft }
  lists:
    - id: whitelist
      label: { fr: Liste blanche, en: Whitelist }
      file: whitelist.json
      format: json_names
      add: [rcon-cli, whitelist, add, "{name}"]
      remove: [rcon-cli, whitelist, remove, "{name}"]
      enabled_field: enable_whitelist
    - id: ops
      label: { fr: Administrateurs (op), en: Operators (op) }
      file: ops.json
      format: json_names
      add: [rcon-cli, op, "{name}"]
      remove: [rcon-cli, deop, "{name}"]
      extra_key: level
  saves:
    volume: data
    marker: level.dat
    siblings: [_nether, _the_end]
    active_field: level
    flush: [rcon-cli, save-all, flush]
  commands:
    - { command: "list", description: { fr: Joueurs connectés, en: Players online } }
    - { command: "say <message>", description: { fr: Message à tous les joueurs, en: Message to every player } }
    - { command: "op <joueur>", description: { fr: Donner les droits d'opérateur, en: Grant operator rights } }
    - { command: "deop <joueur>", description: { fr: Retirer les droits d'opérateur, en: Revoke operator rights } }
    - { command: "whitelist add <joueur>", description: { fr: Ajouter à la liste blanche, en: Add to the whitelist } }
    - { command: "kick <joueur>", description: { fr: Expulser un joueur, en: Kick a player } }
    - { command: "ban <joueur>", description: { fr: Bannir un joueur, en: Ban a player } }
    - { command: "pardon <joueur>", description: { fr: Lever un bannissement, en: Unban a player } }
    - { command: "gamemode creative <joueur>", description: { fr: Changer le mode de jeu, en: Change game mode } }
    - { command: "tp <joueur> <cible>", description: { fr: Téléporter un joueur, en: Teleport a player } }
    - { command: "give <joueur> <objet> 1", description: { fr: Donner un objet, en: Give an item } }
    - { command: "time set day", description: { fr: Passer au jour, en: Set time to day } }
    - { command: "weather clear", description: { fr: Arrêter la pluie, en: Clear the weather } }
    - { command: "difficulty normal", description: { fr: Changer la difficulté, en: Change difficulty } }
    - { command: "save-all", description: { fr: Sauvegarder le monde, en: Save the world } }
    - { command: "stop", description: { fr: Arrêter proprement le serveur, en: Stop the server cleanly } }
  max_players: "{{ form.max_players }}"
  stop_command: stop
summary: [server_type, version, memory, max_players]
defaults:
  zone: gaming
  restart: unless-stopped
